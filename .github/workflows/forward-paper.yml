name: Forward paper desk
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/forward-paper.yml', 'scripts/forward.py']
permissions:
  contents: write
  actions: write
concurrency:
  group: crypto-forward-paper
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load paper framework
        run: |
          unzip -q MultiMarket_Trading_Bot.zip -d "$RUNNER_TEMP/framework"
          python -m pip install -r "$RUNNER_TEMP/framework/trading_bot/requirements.txt"
      - name: Restore portfolio
        run: |
          dest="$RUNNER_TEMP/portfolio"
          refs=$(git ls-remote --heads origin refs/heads/paper-status)
          if [ -n "$refs" ]; then
            git fetch origin refs/heads/paper-status
            git worktree add --detach "$dest" FETCH_HEAD
            test -s "$dest/account.json"
          else
            git worktree add --detach "$dest" HEAD
            git -C "$dest" switch --orphan paper-status
          fi
      - name: Update simulated account and dashboard
        run: |
          dest="$RUNNER_TEMP/portfolio"
          export PYTHONPATH="$RUNNER_TEMP/framework/trading_bot"
          # A manual or recovery launch keeps polling if GitHub delays cron.
          # A scheduled launch processes one check and releases the runner.
          deadline=$((SECONDS + 5400))
          while true; do
            if python scripts/forward.py "$dest" "$PYTHONPATH/configs/crypto.yml"; then
              checked=$(date -u '+%Y-%m-%d %H:%M UTC')
              printf '\nLast successful market check: **%s** · Target interval: 5 minutes.\n' "$checked" >> "$dest/README.md"
              git -C "$dest" add account.json events.jsonl README.md
              if ! git -C "$dest" diff --cached --quiet; then
                git -C "$dest" -c user.name=paper-desk -c user.email=paper-desk@users.noreply.github.com commit -m "Paper desk check at $checked"
                git -C "$dest" push origin HEAD:refs/heads/paper-status
              fi
              echo "Market check succeeded at $checked" >> "$GITHUB_STEP_SUMMARY"
            else
              # Discard an incomplete local update before retrying.
              git -C "$dest" restore --source=HEAD -- . || exit 1
              echo "::warning::Paper market check failed; published portfolio preserved."
              if [ "$GITHUB_EVENT_NAME" = schedule ]; then exit 1; fi
            fi
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then break; fi
            now=$(date +%s)
            delay=$((300 - (now - 20) % 300))
            if (( SECONDS + delay >= deadline )); then break; fi
            sleep "$delay"
          done
      - name: Hand off to the next paper worker
        if: success() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Let an updated workflow or a waiting schedule take over first.
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then exit 0; fi
          waiting=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forward-paper.yml/runs?branch=main&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "$waiting" = 0 ]; then
            gh workflow run forward-paper.yml --ref main
          fi
